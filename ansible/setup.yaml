---
# Set up a new install: packages, Nix, the dotfiles via Home Manager, and the
# desktop. Works on Linux Mint / Ubuntu (apt) and CachyOS / Arch (pacman),
# picked by the package manager Ansible finds.
#
#   sudo apt install ansible git       # Mint / Ubuntu
#   sudo pacman -S ansible git         # CachyOS / Arch
#   git clone --recursive https://github.com/BlaiseRideout/dotfiles.git ~/.dotfiles
#   cd ~/.dotfiles/ansible
#   ansible-playbook setup.yaml                        # Sway machine
#   ansible-playbook setup.yaml -e desktop=openbox     # Openbox + tint2 machine
#   ansible-playbook setup.yaml -e apps=false          # skip the desktop apps (already the default on uhnet)
#   ansible-playbook setup.yaml -e hyprland=true       # ...plus Hyprland (default on nhuto, nhuto-Mint)
#   ansible-playbook setup.yaml -e build_sway=true     # apt: self-built Sway 1.11 + Waybar (default on nhuto-Mint; Waybar is built on pacman too)
#   ansible-playbook setup.yaml -e llama_update=true   # update llama.cpp (installed by default on nhuto, nhuto-Mint)
#
# It asks for the sudo password once. Safe to re-run; on pacman each run also
# upgrades the system (installing after a bare `pacman -Sy` risks a partial
# upgrade).
#
# Home Manager uses the flake config named "<user>@<hostname>", or the one in
# -e hm_config=<name> (e.g. laptop). See flake.nix.

- hosts: computers
  vars:
    desktop: sway          # sway | openbox
    # Hyprland next to Sway. apt: from Nix, with build/hyprland/system-setup.sh
    # (home/hosts/nhuto-Mint.nix); pacman: the distro's packages.
    hyprland: "{{ ansible_facts['hostname'] in ['nhuto', 'nhuto-Mint'] }}"
    # apt only: build Sway 1.11 + Waybar into ~/.local/opt, as NVIDIA needs
    # newer than Ubuntu's. A workaround for nhuto-Mint (the desktop on Mint).
    build_sway: "{{ ansible_facts['hostname'] == 'nhuto-Mint' }}"
    # Build Waybar from waybar_version: everywhere on pacman (Arch's 0.15.0 lacks the
    # tray features bar.jsonc uses); on apt it needs build_sway's Wayland
    build_waybar: "{{ build_sway | bool or pkg_mgr == 'pacman' }}"
    # CachyOS shell and its flat Dropbox/Discord tray adapter.
    noctalia: "{{ ansible_facts['hostname'] == 'nhuto' and pkg_mgr == 'pacman' and hyprland | bool }}"
    # GIMP, Spotify, VS Code, Discord, etc. (see below). Off on uhnet, a server.
    apps: "{{ ansible_facts['hostname'] != 'uhnet' }}"
    # llama.cpp from llama.app's prebuilt binaries (CUDA here), for llama-serve.service
    # (home/hosts/nhuto.nix). Installed once; -e llama_update=true fetches the latest,
    # or -e llama_version=b12019 a given build.
    llama: "{{ ansible_facts['hostname'] in ['nhuto', 'nhuto-Mint'] }}"
    llama_update: false
    llama_version: ""
    hm_config: "{{ ansible_facts['user_id'] }}@{{ ansible_facts['hostname'] }}"
    dotfiles: "{{ ansible_facts['env']['HOME'] }}/.dotfiles"
    dotfiles_repo: https://github.com/BlaiseRideout/dotfiles.git
    nix: /nix/var/nix/profiles/default/bin/nix
    pkg_mgr: "{{ ansible_facts['pkg_mgr'] }}"   # apt | pacman

    # Pinned sources for the self-built Sway (see build/sway/build.sh)
    sway_src: "{{ ansible_facts['env']['HOME'] }}/.local/src/sway-1.11"
    sway_sources:
      - { name: wayland,  repo: "https://gitlab.freedesktop.org/wayland/wayland.git",  version: "1.24.0" }
      - { name: libinput, repo: "https://gitlab.freedesktop.org/libinput/libinput.git", version: "1.26.2" }
      - { name: pixman,   repo: "https://gitlab.freedesktop.org/pixman/pixman.git",    version: "pixman-0.46.4" }
      - { name: wlroots,  repo: "https://gitlab.freedesktop.org/wlroots/wlroots.git",  version: "0.19.3" }
      - { name: sway,     repo: "https://github.com/swaywm/sway.git",                  version: "1.11" }
    # Unreleased master plus the tray icon wildcard patch (the fork's tray-icons-glob
    # branch), for the tray ignore-list and custom icons (see build/waybar/build.sh)
    waybar_repo: https://github.com/BlaiseRideout/Waybar.git
    waybar_src: "{{ ansible_facts['env']['HOME'] }}/.local/src/waybar"
    waybar_version: 7121ff779c89da1cb0a81aa4b1ae0f1b9e098716

    # The GTK theme and icons in .config/gtk-{3,4}.0/settings.ini, built from their repos
    orchis_repo: https://github.com/vinceliuice/Orchis-theme.git
    orchis_src: "{{ ansible_facts['env']['HOME'] }}/.local/src/orchis-theme"
    flatery_repo: https://github.com/cbrnix/Flatery.git
    flatery_src: "{{ ansible_facts['env']['HOME'] }}/.local/src/flatery"

    # Package lists per package manager, same order in both
    base_packages:
      apt:
        - git
        - curl
        - openssh-client    # shared ssh-agent.service
        - xz-utils          # for the Nix installer
        - build-essential
        - zsh
        - tmux
        - fzf
        - htop
        - jq
        - ripgrep
        - powerline         # zsh, bash and tmux prompts (~/.config/powerline)
        - python3-powerline
        - fonts-powerline
        - pipx
        - lm-sensors
        - x11-xserver-utils # xrdb, xmodmap
        - feh
        - sassc             # builds the Orchis GTK theme
      pacman:
        - git
        - curl
        - openssh           # shared ssh-agent.service
        - xz
        - base-devel
        - tree-sitter-cli   # nvim-treesitter needs the CLI, not just libtree-sitter
        - zsh
        - tmux
        - fzf
        - htop
        - jq
        - ripgrep
        - powerline         # includes the Python module
        - powerline-fonts
        - python-pipx
        - lm_sensors
        - xorg-xrdb
        - xorg-xmodmap
        - feh
        - sassc             # builds the Orchis GTK theme

    sway_packages:
      apt:
        - sway              # Ubuntu's 1.9: fallback session, plus swaybg
        - xwayland
        - kanshi
        - mako-notifier
        - wofi
        - swayidle
        - swaylock
        - grim
        - slurp
        - grimshot
        - wl-clipboard
        - udiskie
        - mate-polkit       # polkit-gnome's agent crashes after a cancelled prompt
        - playerctl
        - brightnessctl
        - pulseaudio-utils  # pactl
        - dex
        - network-manager-gnome
        - blueman
        - copyq
        - gsimplecal
        - kitty
        - python3-i3ipc     # sway/autotiling.py, center_single.py
        - xdg-desktop-portal-wlr
        - xdg-desktop-portal-gtk
      pacman:
        - sway
        - waybar            # self-built on Mint
        - xorg-xwayland
        - kanshi
        - mako
        - wofi
        - swayidle
        - swaylock
        - grim
        - slurp
        - sway-contrib      # grimshot
        - wl-clipboard
        - udiskie
        - mate-polkit
        - playerctl
        - brightnessctl
        - libpulse          # pactl
        - dex
        - network-manager-applet
        - blueman
        - copyq
        - gsimplecal
        - kitty
        - python-i3ipc
        - xdg-desktop-portal-wlr
        - xdg-desktop-portal-gtk
        - ttf-ubuntu-font-family   # the font in the hypr, fuzzel and GTK settings (Mint has it)

    # pacman only (apt gets Hyprland from Nix)
    hyprland_packages:
      - hyprland
      - hyprland-guiutils
      - hyprpaper
      - hypridle
      - hyprlock
      - hyprpolkitagent
      - xdg-desktop-portal-hyprland
      - grimblast-git       # CachyOS's repo (AUR elsewhere)
      - fuzzel
      - cliphist

    # CachyOS supplies noctalia; the tray adapter uses the system Python.
    noctalia_packages:
      - noctalia
      - python-dbus
      - python-gobject

    openbox_packages:
      apt:
        - openbox
        - tint2
        - copyq
        - network-manager-gnome
        - spacefm           # ~/.autostart.sh
        - autocutsel        # ~/.autostart.sh: syncs the clipboard and primary selection
      pacman:
        - openbox
        - tint2
        - copyq
        - network-manager-applet

    # Desktop apps (apps=true). FSearch and OpenRGB come from Flathub on both
    # (hyprland.lua and the FSearch stylesheet expect the Flatpak).
    # apt: Spotify from its own repo, Dropbox from Mint's "import" repo; VS Code
    # and Discord are .debs (VS Code's adds its own apt repo for updates).
    # pacman: the rest from the repos, Dropbox and Microsoft's VS Code from the
    # AUR (with paru, from CachyOS's repo).
    app_packages:
      apt:
        - gimp
        - audacity
        - keepassxc
        - dropbox
        - spotify-client
        - flatpak
      pacman:
        - gimp
        - audacity
        - keepassxc
        - spotify-launcher
        - discord
        - flatpak
        - paru
    app_debs:
      - { name: code,    url: "https://update.code.visualstudio.com/latest/linux-deb-x64/stable" }
      - { name: discord, url: "https://discord.com/api/download?platform=linux&format=deb" }
    app_aur:
      - dropbox
      - visual-studio-code-bin
    app_flatpaks:
      - io.github.cboxdoerfer.FSearch
      - org.openrgb.OpenRGB
    # Spotify rotates its signing key about yearly; get the new id from
    # https://www.spotify.com/download/linux/ when apt reports NO_PUBKEY
    spotify_key: https://download.spotify.com/debian/pubkey_5384CE82BA52C83A.gpg

    # apt only: for build/sway/build.sh and build/waybar/build.sh
    # pacman: for build/waybar/build.sh; the waybar package brings its libraries
    waybar_build_packages:
      - meson
      - ninja
      - glib2-devel      # gdbus-codegen

    build_packages:
      - meson
      - ninja-build
      - cmake
      - pkg-config
      - scdoc
      - hwdata
      - wayland-protocols
      - libffi-dev
      - libexpat1-dev
      - libxml2-dev
      - libdrm-dev
      - libgbm-dev
      - libegl-dev
      - libgles-dev
      - libseat-dev
      - libdisplay-info-dev
      - libliftoff-dev
      - libxkbcommon-dev
      - libpixman-1-dev
      - libpango1.0-dev
      - libcairo2-dev
      - libgdk-pixbuf-2.0-dev
      - libjson-c-dev
      - libpcre2-dev
      - liblcms2-dev
      - libsystemd-dev
      - libudev-dev
      - libevdev-dev
      - libmtdev-dev
      - libwacom-dev
      - libxcb1-dev
      - libxcb-composite0-dev
      - libxcb-ewmh-dev
      - libxcb-icccm4-dev
      - libxcb-render0-dev
      - libxcb-res0-dev
      - libxcb-xfixes0-dev
      # Waybar
      - libgtkmm-3.0-dev
      - libjsoncpp-dev
      - libsigc++-2.0-dev
      - libdbusmenu-gtk3-dev
      - libpulse-dev
      - libxkbregistry-dev

    packages: >-
      {{ base_packages[pkg_mgr]
         + (sway_packages[pkg_mgr] if desktop == 'sway' else openbox_packages[pkg_mgr])
         + (hyprland_packages if hyprland | bool and pkg_mgr == 'pacman' else [])
         + (noctalia_packages if noctalia | bool else [])
         + (build_packages if build_sway | bool and pkg_mgr == 'apt' else [])
         + (waybar_build_packages if build_waybar | bool and pkg_mgr == 'pacman' else []) }}

  tasks:
    - name: Check the variables
      ansible.builtin.assert:
        that:
          - desktop in ['sway', 'openbox']
          - pkg_mgr in ['apt', 'pacman']
          - not (noctalia | bool and (pkg_mgr != 'pacman' or not hyprland | bool))
          - not (build_sway | bool and pkg_mgr != 'apt')
          - not (build_waybar | bool and pkg_mgr == 'apt' and not build_sway | bool)
        fail_msg: >-
          desktop must be sway or openbox (not {{ desktop }}), the package
          manager apt or pacman (not {{ pkg_mgr }}), build_sway is for apt only, and on
          apt build_waybar needs build_sway; noctalia needs pacman and hyprland=true

    # --- System (root) ---------------------------------------------------------

    - name: Install packages (apt)
      when: pkg_mgr == 'apt'
      become: true
      ansible.builtin.apt:
        update_cache: true
        name: "{{ packages }}"

    - name: Upgrade the system (pacman)
      when: pkg_mgr == 'pacman'
      become: true
      community.general.pacman:
        update_cache: true
        upgrade: true

    - name: Install packages (pacman)
      when: pkg_mgr == 'pacman'
      become: true
      community.general.pacman:
        update_cache: true
        name: "{{ packages }}"

    - name: Install Neovim's Python provider
      community.general.pipx:
        name: pynvim

    # --- Desktop apps (apps=true) -----------------------------------------------

    - name: Install desktop apps (apt)
      when: apps | bool and pkg_mgr == 'apt'
      become: true
      block:
        - name: Ensure /etc/apt/keyrings exists
          ansible.builtin.file:
            path: /etc/apt/keyrings
            state: directory
            mode: "0755"

        - name: Add the Spotify signing key
          ansible.builtin.get_url:
            url: "{{ spotify_key }}"
            dest: /etc/apt/keyrings/spotify.gpg
            mode: "0644"

        # The old one-line list (from Spotify's instructions) would clash with the
        # Signed-By below
        - name: Remove the old Spotify list
          ansible.builtin.file:
            path: /etc/apt/sources.list.d/spotify.list
            state: absent

        - name: Add the Spotify repository
          ansible.builtin.deb822_repository:
            name: spotify
            uris: https://repository.spotify.com
            suites: stable
            components: non-free
            signed_by: /etc/apt/keyrings/spotify.gpg

        - name: Install apps from apt
          ansible.builtin.apt:
            update_cache: true
            name: "{{ app_packages.apt }}"

        - name: Check installed packages
          ansible.builtin.package_facts:

        - name: Download VS Code and Discord
          ansible.builtin.get_url:
            url: "{{ item.url }}"
            dest: "/tmp/{{ item.name }}.deb"
            mode: "0644"
          loop: "{{ app_debs }}"
          loop_control:
            label: "{{ item.name }}"
          when: item.name not in ansible_facts.packages

        - name: Install VS Code and Discord
          ansible.builtin.apt:
            deb: "/tmp/{{ item.name }}.deb"
          loop: "{{ app_debs }}"
          loop_control:
            label: "{{ item.name }}"
          when: item.name not in ansible_facts.packages

    - name: Install desktop apps (pacman)
      when: apps | bool and pkg_mgr == 'pacman'
      block:
        - name: Install apps from the repos
          become: true
          community.general.pacman:
            name: "{{ app_packages.pacman }}"

        # paru builds as the user and runs pacman through sudo, which can't ask
        # for the password here: let it run pacman without one, just for this
        - name: Let paru run pacman without a password
          become: true
          ansible.builtin.copy:
            dest: /etc/sudoers.d/ansible-paru
            content: "{{ ansible_facts['user_id'] }} ALL=(root) NOPASSWD: /usr/bin/pacman\n"
            mode: "0440"
            validate: visudo -cf %s

        - name: Install apps from the AUR
          ansible.builtin.command: paru -S --needed --noconfirm --skipreview {{ app_aur | join(' ') }}
          register: aur
          changed_when: "'there is nothing to do' not in aur.stdout"

      always:
        - name: Take paru's pacman permission back
          become: true
          ansible.builtin.file:
            path: /etc/sudoers.d/ansible-paru
            state: absent

    - name: Install apps from Flathub, and OpenRGB's device access
      when: apps | bool
      become: true
      block:
        - name: Add Flathub
          ansible.builtin.command: >-
            flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          changed_when: false

        - name: Install apps from Flathub
          ansible.builtin.command: flatpak install --noninteractive --system flathub {{ item }}
          args:
            creates: "/var/lib/flatpak/app/{{ item }}"
          loop: "{{ app_flatpaks }}"

        # OpenRGB needs udev rules to reach the RGB devices without root (the
        # Flatpak can't install them itself), and i2c-dev for motherboard and RAM
        # lighting. The rules come from the installed OpenRGB, so they match it.
        - name: Get OpenRGB's udev rules
          ansible.builtin.command: flatpak run org.openrgb.OpenRGB --print-udev-rules
          register: openrgb_rules
          changed_when: false

        - name: Install OpenRGB's udev rules
          ansible.builtin.copy:
            dest: /etc/udev/rules.d/60-openrgb.rules
            content: "{{ openrgb_rules.stdout }}\n"
            mode: "0644"
          register: openrgb_rules_file

        - name: Apply the udev rules
          ansible.builtin.shell: udevadm control --reload-rules && udevadm trigger
          when: openrgb_rules_file.changed

        - name: Load i2c-dev at boot
          ansible.builtin.copy:
            dest: /etc/modules-load.d/i2c-dev.conf
            content: "i2c-dev\n"
            mode: "0644"

        - name: Load i2c-dev now
          ansible.builtin.command: modprobe i2c-dev
          changed_when: false

    - name: Use zsh as the login shell
      become: true
      ansible.builtin.user:
        name: "{{ ansible_facts['user_id'] }}"
        shell: /usr/bin/zsh

    - name: Install Nix (multi-user)
      become: true
      ansible.builtin.shell: set -o pipefail; curl -fsSL https://nixos.org/nix/install | sh -s -- --daemon --yes
      args:
        executable: /bin/bash
        creates: "{{ nix }}"

    - name: Enable flakes
      become: true
      ansible.builtin.lineinfile:
        path: /etc/nix/nix.conf
        regexp: '^experimental-features\s*='
        line: experimental-features = nix-command flakes
      register: nix_conf

    - name: Restart the Nix daemon
      become: true
      ansible.builtin.systemd:
        name: nix-daemon
        state: restarted
      when: nix_conf.changed

    # --- Dotfiles and Home Manager ----------------------------------------------

    - name: Clone the dotfiles
      ansible.builtin.git:
        repo: "{{ dotfiles_repo }}"
        dest: "{{ dotfiles }}"
        recursive: true
        update: false   # never touch an existing checkout

    # Home Manager writes into these, so they must be real folders, not links
    # into the repo (as the pre-Home-Manager setup had them)
    # (A folder link would make Home Manager's -b backup rename the repo's own files.)
    - name: Check for old whole-folder links
      ansible.builtin.stat:
        path: "{{ ansible_facts['env']['HOME'] }}/{{ item }}"
      loop: [.config/systemd, .config/environment.d, scripts]
      register: old_links

    - name: Remove old whole-folder links
      ansible.builtin.file:
        path: "{{ item.stat.path }}"
        state: absent
      loop: "{{ old_links.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: item.stat.islnk | default(false)

    # Orchis's installer/older setup can link gtk.css directly to the theme.
    # Home Manager's -b only backs up regular files, not foreign symlinks.
    - name: Check for the old Orchis GTK 4 stylesheet link
      ansible.builtin.stat:
        path: "{{ ansible_facts['env']['HOME'] }}/.config/gtk-4.0/gtk.css"
        follow: false
      register: orchis_gtk_link

    - name: Back up the old Orchis GTK 4 stylesheet link
      ansible.builtin.command:
        argv:
          - mv
          - --backup=numbered
          - --
          - "{{ ansible_facts['env']['HOME'] }}/.config/gtk-4.0/gtk.css"
          - "{{ ansible_facts['env']['HOME'] }}/.config/gtk-4.0/gtk.css.bak"
      when:
        - orchis_gtk_link.stat.islnk | default(false)
        - orchis_gtk_link.stat.lnk_source | default('') == ansible_facts['env']['HOME'] + '/.themes/Orchis-Pink-Dark/gtk-4.0/gtk.css'

    # -b bak: existing files in the way are renamed to <name>.bak, not overwritten
    - name: Apply the Home Manager config
      ansible.builtin.command: >-
        {{ nix }} run home-manager -- switch -b bak --flake {{ dotfiles }}#{{ hm_config }}
      environment:
        PATH: "/nix/var/nix/profiles/default/bin:{{ ansible_facts['env']['PATH'] }}"
      register: hm
      changed_when: "'Activating' in hm.stdout"

    # Home Manager links/enables the unit; start it on this login too.
    - name: Start the shared SSH agent
      ansible.builtin.systemd:
        name: ssh-agent.service
        scope: user
        daemon_reload: true
        state: started

    # Defer graphical services when provisioning over SSH or a TTY.
    - name: Check for an active graphical session
      when: noctalia | bool
      ansible.builtin.command: systemctl --user is-active graphical-session.target
      register: graphical_session
      changed_when: false
      failed_when: graphical_session.rc not in [0, 3]

    - name: Start Noctalia's flat tray adapter
      when: noctalia | bool and graphical_session.rc == 0
      ansible.builtin.systemd:
        name: noctalia-flat-tray.service
        scope: user
        state: started

    # The login screen runs its own compositor, so it doesn't see hyprland.lua; this
    # repeats its monitor layout (same make/model/serial IDs, same positions).
    # greeter.toml is declarative: neither Sync nor the greeter UI rewrites it. Read
    # at greetd start, so it applies at the next boot or `systemctl restart greetd`
    # (which ends the running session; not done here).
    - name: Give the login screen the Hyprland monitor layout
      when: noctalia | bool
      become: true
      ansible.builtin.copy:
        dest: /var/lib/noctalia-greeter/greeter.toml
        owner: greeter
        group: greeter
        mode: "0644"
        content: |
          [output]
          layout = "Samsung Electric Company Odyssey G95C HNTY301994:0,100; AOC 24G15N AP15338Z04043:5120,0"
          scales = "Samsung Electric Company Odyssey G95C HNTY301994:1; AOC 24G15N AP15338Z04043:1"
          transforms = "AOC 24G15N AP15338Z04043:270"
          width = 5120
          height = 1440
          refresh_rate = "Samsung Electric Company Odyssey G95C HNTY301994:240; AOC 24G15N AP15338Z04043:180"

    # --- llama.cpp (llama=true) -----------------------------------------------------
    # The installer replaces ~/.llama-app (what the service runs) and copies the
    # binary to ~/.local/bin/llama. It downloads ~560 MB, so only when missing or asked.
    - name: Set up llama.cpp
      when: llama | bool
      block:
        - name: Check for llama.cpp
          ansible.builtin.stat:
            path: "{{ ansible_facts['env']['HOME'] }}/.llama-app/llama"
          register: llama_bin

        - name: Install llama.cpp
          ansible.builtin.shell: set -o pipefail; curl -fsSL https://llama.app/install.sh | sh
          args:
            executable: /bin/bash
          environment:
            LLAMA_VERSION: "{{ llama_version }}"   # empty: the latest
          when: llama_update | bool or not llama_bin.stat.exists
          register: llama_install

        # Models live on a native Linux filesystem: the NTFS files disk can't hold the
        # symlinks Hugging Face's cache needs (ntfs3 shows them as unreadable stubs).
        - name: Create the model cache
          ansible.builtin.file:
            path: "{{ ansible_facts['env']['HOME'] }}/.local/share/huggingface"
            state: directory
            mode: "0755"

        - name: Link ~/.cache/huggingface to the model cache
          ansible.builtin.file:
            src: "{{ ansible_facts['env']['HOME'] }}/.local/share/huggingface"
            dest: "{{ ansible_facts['env']['HOME'] }}/.cache/huggingface"
            state: link

        # Home Manager links the unit and enables it (default.target.wants)
        - name: Start llama-serve, restarting it onto a new binary
          ansible.builtin.systemd:
            name: llama-serve.service
            scope: user
            daemon_reload: true
            state: "{{ 'restarted' if llama_install.changed else 'started' }}"

    # --- Hyprland from Nix (apt, hyprland=true) -----------------------------------
    # Hyprland and its apps come from Nix (home/hosts/nhuto-Mint.nix). The script links the
    # GPU drivers for Nix programs and adds the login session and hyprlock's PAM
    # setup; rerun it after an NVIDIA update. On pacman the packages above bring
    # all of that.
    - name: Set up the Hyprland session
      when: hyprland | bool and pkg_mgr == 'apt'
      become: true
      ansible.builtin.command: "{{ dotfiles }}/build/hyprland/system-setup.sh"
      environment:
        SUDO_USER: "{{ ansible_facts['user_id'] }}"
      changed_when: true

    # --- GTK theme and icons ----------------------------------------------------------
    # Orchis-Pink-Dark into ~/.themes and Flatery-Pink-Dark into ~/.local/share/icons. The settings
    # files that select them, and the gtk-4.0 links for libadwaita apps, come from
    # Home Manager; nwg-look changes the settings.

    - name: Fetch the GTK theme and icon sources
      ansible.builtin.git:
        repo: "{{ item.repo }}"
        dest: "{{ item.dest }}"
        depth: 1
        update: false
      loop:
        - { repo: "{{ orchis_repo }}", dest: "{{ orchis_src }}" }
        - { repo: "{{ flatery_repo }}", dest: "{{ flatery_src }}" }
      loop_control:
        label: "{{ item.dest }}"

    - name: Install the Orchis-Pink-Dark GTK theme
      ansible.builtin.command: ./install.sh -d "{{ ansible_facts['env']['HOME'] }}/.themes" -t pink -c dark -s standard
      args:
        chdir: "{{ orchis_src }}"
        creates: "{{ ansible_facts['env']['HOME'] }}/.themes/Orchis-Pink-Dark"

    # install.sh lists its own folder, so it runs from there
    - name: Install the Flatery-Pink-Dark icons
      ansible.builtin.command: ./install.sh -v "Pink-Dark"
      args:
        chdir: "{{ flatery_src }}"
        creates: "{{ ansible_facts['env']['HOME'] }}/.local/share/icons/Flatery-Pink-Dark"

    - name: Install sway_auto_floating (floating rules)
      ansible.builtin.command: pipx install git+https://github.com/artemave/sway_auto_floating
      args:
        creates: "{{ ansible_facts['env']['HOME'] }}/.local/bin/sway_auto_floating"
      when: desktop == 'sway'

    # --- Self-built Sway 1.11 (apt, build_sway=true) -------------------------------

    - name: Build Sway 1.11
      when: build_sway | bool
      block:
        - name: Fetch Sway sources
          ansible.builtin.git:
            repo: "{{ item.repo }}"
            dest: "{{ sway_src }}/{{ item.name }}"
            version: "{{ item.version }}"
          loop: "{{ sway_sources }}"
          loop_control:
            label: "{{ item.name }} {{ item.version }}"
          register: sway_git

        - name: Check for built Sway
          ansible.builtin.stat:
            path: "{{ ansible_facts['env']['HOME'] }}/.local/opt/sway/bin/sway"
          register: sway_built

        - name: Build Sway (takes a few minutes)
          ansible.builtin.command: "{{ dotfiles }}/build/sway/build.sh"
          environment:
            SRC: "{{ sway_src }}"
          when: sway_git.changed or not sway_built.stat.exists

        - name: Install the Sway NVIDIA launcher
          ansible.builtin.copy:
            src: "{{ dotfiles }}/build/sway/sway-nvidia"
            dest: "{{ ansible_facts['env']['HOME'] }}/.local/opt/sway/bin/sway-nvidia"
            mode: "0755"

        - name: Add the login session
          become: true
          ansible.builtin.copy:
            dest: /usr/share/wayland-sessions/sway-1.11-nvidia.desktop
            mode: "0644"
            content: |
              [Desktop Entry]
              Name=Sway 1.11 (NVIDIA)
              Comment=Self-built Sway with explicit sync
              Exec={{ ansible_facts['env']['HOME'] }}/.local/opt/sway/bin/sway-nvidia
              Type=Application
              DesktopNames=sway

    # --- Self-built Waybar (build_waybar=true) --------------------------------------
    # launch.sh prefers it over the system one

    - name: Build Waybar
      when: build_waybar | bool
      block:
        # force: build.sh patches a source file, which git would otherwise refuse to overwrite
        - name: Fetch Waybar source
          ansible.builtin.git:
            repo: "{{ waybar_repo }}"
            dest: "{{ waybar_src }}"
            version: "{{ waybar_version }}"
            force: true
          register: waybar_git

        - name: Check for built Waybar
          ansible.builtin.stat:
            path: "{{ ansible_facts['env']['HOME'] }}/.local/opt/waybar/bin/waybar"
          register: waybar_built

        # Rebuilt after a Sway rebuild too on apt: it links the Sway prefix's Wayland
        - name: Build Waybar
          ansible.builtin.command: "{{ dotfiles }}/build/waybar/build.sh"
          environment:
            SRC: "{{ waybar_src }}"
          when: waybar_git.changed or (sway_git.changed | default(false)) or not waybar_built.stat.exists

        # So `waybar` in a terminal runs this one (launch.sh uses the full path)
        - name: Link Waybar into ~/.local/bin
          ansible.builtin.file:
            src: "{{ ansible_facts['env']['HOME'] }}/.local/opt/waybar/bin/waybar"
            dest: "{{ ansible_facts['env']['HOME'] }}/.local/bin/waybar"
            state: link
