# lenovo-yb9-kbdock from Linux 7.3.1 with the Yoga Book 9 13IMU9 (DMI 83FF) added
# to its DMI table. Installed by ansible/yoga.yaml on yoga-linux only; see
# docs/yoga-book/kbdock.md. Bump PACKAGE_VERSION whenever the .c file changes.
# No hyphen in the version: pacman's dkms hook splits /usr/src/<name>-<version> at the LAST hyphen,
# so "7.3.1-1" made it register a second module "lenovo-yb9-kbdock-7.3.1" version "1".
PACKAGE_NAME="lenovo-yb9-kbdock"
PACKAGE_VERSION="7.3.1.1"
BUILT_MODULE_NAME[0]="lenovo-yb9-kbdock"
# updates/ is searched before kernel/, so this copy shadows the in-tree module
DEST_MODULE_LOCATION[0]="/updates/dkms"
MAKE[0]="make KVER=${kernelver} KDIR=${kernel_source_dir}"
CLEAN="make KVER=${kernelver} KDIR=${kernel_source_dir} clean"
# the WMI API this driver uses (notify_new, min_event_size) arrived in 7.3, so the
# 6.18 LTS kernel cannot build it
BUILD_EXCLUSIVE_KERNEL="^(7\.([3-9]|[1-9][0-9])|([89]|[1-9][0-9])\.)"
AUTOINSTALL="yes"
