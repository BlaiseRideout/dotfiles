# DKMS module signing with the same key that signs the kernel (rEFInd "local" key),
# so the one MOK enrollment covers kernel, rEFInd and out-of-tree modules
# (docs/yoga-book/secureboot.md, section "Kernel modules"). Installed to
# /etc/dkms/framework.conf.d/yoga-secureboot.conf by setup.sh / ansible, only once
# BOTH files below exist: if either is missing dkms silently generates a new
# key + cert at that path (and would overwrite the one that is there).
mok_signing_key=/etc/refind.d/keys/refind_local.key
mok_certificate=/etc/refind.d/keys/refind_local.crt
