# Theme for the Hypr apps drawn with hyprtoolkit (hyprpolkitagent's password
# prompts, hyprland-guiutils' dialogs), in the window colours from sway/config's
# client.* lines (also hyprland.lua's borders, fuzzel.ini and
# copyq/themes/wm.ini): pink focused border, deep pink title, cream text on dark
# grey. Font and icons from GTK. The apps read this when they start.
# Defaults and keys: hyprtoolkit's src/palette/ConfigManager.cpp.

background       = rgb(222222)   # unfocused window background
base             = rgb(1d1d1d)   # entry and list background (mako's background)
alternate_base   = rgb(333333)   # inactive borders
text             = rgb(f7f6ec)   # focused title text
bright_text      = rgb(ffffff)
link_text        = rgb(d18ea6)
accent           = rgb(ce3e60)   # focused title background: the selected entry
accent_secondary = rgb(d18ea6)   # focused border

font_family           = Ubuntu   # gsettings font-name, 'Ubuntu 10'
font_family_monospace = Ubuntu Mono
font_size       = 11
small_font_size = 9
h1_size = 18
h2_size = 14
h3_size = 12

icon_theme = Mint-Y-Orange   # gsettings icon-theme

# Rounded like fuzzel and FSearch
rounding_small = 6
rounding_large = 10
