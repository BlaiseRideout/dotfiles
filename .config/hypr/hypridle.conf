# Idle under Hyprland, as swayidle does under Sway: lock at 10 minutes, screens
# off at 15, never suspend. lock.sh picks hyprlock (or swaylock until hyprlock's
# PAM setup is in place, see system-setup.sh).

general {
    lock_cmd = ~/scripts/lock.sh                # what `loginctl lock-session` runs
    before_sleep_cmd = loginctl lock-session    # lock before the laptop suspends
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

listener {
    timeout = 900
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}
