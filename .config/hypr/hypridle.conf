# Idle under Hyprland, as swayidle does under Sway: lock at 10 minutes, screens
# off at 15, never suspend. lock.sh picks hyprlock (or, on nhuto-Mint, swaylock
# until hyprlock's PAM setup is in place: build/hyprland/system-setup.sh).
#
# Locking calls lock.sh directly rather than `loginctl lock-session`: Noctalia
# also answers logind's Lock signal with its own lock screen, which made two
# lockers race each other. (Noctalia's idle behaviours and its lock before
# suspend are off too: .config/noctalia/dotfiles/idle.toml.)

general {
    lock_cmd = ~/scripts/lock.sh                # if anything does call `loginctl lock-session`
    before_sleep_cmd = ~/scripts/lock.sh        # lock before the laptop suspends
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'

    # Like swayidle, only honour the compositor's idle inhibitors (a fullscreen
    # video, Noctalia's caffeine). Electron apps and Discord ask hypridle over
    # D-Bus to stay awake and can keep that going indefinitely.
    ignore_dbus_inhibit = true
}

listener {
    timeout = 600
    on-timeout = ~/scripts/lock.sh
    # The first key or touch after the lock: hyprlock's own face scan ran when it came up, minutes
    # ago, so scan again and unlock on a match (Yoga Book only; yoga-lock-face is not on other
    # machines, hence the `|| true`). The 900 s listener below resumes too, but this one
    # covers it: it timed out first.
    on-resume = ~/.local/bin/yoga-lock-face || true
}

listener {
    timeout = 900
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}
