# Wallpapers under Hyprland, the same picks as sway/home_wallpapers.json: a
# random image from each monitor's folder, changed every 15 minutes. Monitors
# are matched by the start of their description (`hyprctl monitors`); a named
# one wins over "*". hyprpaper reloads this file when it changes.
splash = false

wallpaper {
    monitor = desc:Samsung Electric Company Odyssey G95C
    path = /home/blaise/images/wallpapers/holo/dualwide
    order = random-shuffle
    timeout = 900
    fit_mode = cover
}

wallpaper {
    monitor = desc:AOC 24G15N
    path = /home/blaise/images/wallpapers/holo/vertical
    order = random-shuffle
    timeout = 900
    fit_mode = cover
}

# Everything else: laptop panel, TV, other desks
wallpaper {
    monitor = *
    path = /home/blaise/images/wallpapers/holo/wide
    order = random-shuffle
    timeout = 900
    fit_mode = cover
}
