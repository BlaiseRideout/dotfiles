# Lock screen under Hyprland (lock.sh runs it). A blurred, darkened screenshot of
# each monitor in place of lock.sh's distorted ones, and Sway's colours.
# Clear the password with Esc or Ctrl+U.

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.02
    brightness = 0.6
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 4
    rounding = 0
    outer_color = rgb(d18ea6)
    inner_color = rgba(34, 34, 34, 0.8)
    font_color = rgb(247, 246, 236)
    check_color = rgb(ce3e60)
    fail_color = rgb(ce3e60)
    font_family = Ubuntu
    placeholder_text = Password
    fail_text = $PAMFAIL
    fade_on_empty = false
    dots_spacing = 0.3
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    font_size = 90
    font_family = Ubuntu
    color = rgb(247, 246, 236)
    position = 0, 160
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    font_size = 24
    font_family = Ubuntu
    color = rgb(247, 246, 236)
    position = 0, 70
    halign = center
    valign = center
}
