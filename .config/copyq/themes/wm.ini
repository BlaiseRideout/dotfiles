; CopyQ theme in the window colours from sway/config's client.* lines (also
; hyprland.lua's borders and hypr/hyprtoolkit.conf): pink focused border, deep
; pink title, cream text on dark grey, rounded like the windows.
; Linked into ~/.config/copyq/themes by home/sway.nix. CopyQ copies a theme into
; copyq.conf when it's loaded, so after a change run
;   copyq loadTheme ~/.config/copyq/themes/wm.ini
; (or pick it in Preferences > Appearance).
[General]
bg=#222222
fg=#f7f6ec
alt_bg=#292929
sel_bg=#ce3e60
sel_fg=#f7f6ec
edit_bg=#1d1d1d
edit_fg=#f7f6ec
find_bg=#d18ea6
find_fg=#222222
notes_bg=#333333
notes_fg=#f7f6ec
num_fg=#888888
notification_bg=#1d1d1d
notification_fg=#f7f6ec

font="Ubuntu,10,-1,5,50,0,0,0,0,0"
edit_font="Ubuntu,10,-1,5,50,0,0,0,0,0"
find_font="Ubuntu,10,-1,5,50,0,0,0,0,0"
notes_font="Ubuntu,10,-1,5,50,0,0,0,0,0"
num_font="Ubuntu,7,-1,5,25,0,0,0,0,0"
notification_font="Ubuntu,10,-1,5,50,0,0,0,0,0"

; Colour the whole window (tabs, tool bar, search bar), not just the items
style_main_window=true
show_number=true
show_scrollbars=true
use_system_icons=true

cur_item_css="\n    ;border: 0.1em solid ${find_bg}\n    ;border-radius: 4px"
sel_item_css="\n    ;border-radius: 4px"
search_bar="\n    ;background: ${edit_bg}\n    ;color: ${edit_fg}\n    ;border: 1px solid ${alt_bg}\n    ;border-radius: 4px\n    ;margin: 2px"
search_bar_focused="\n    ;border: 1px solid ${find_bg}"
menu_css="\n    ;border: 1px solid ${find_bg}\n    ;background: ${bg}\n    ;color: ${fg}"
tab_tree_sel_item_css="\n    ;color: ${sel_fg}\n    ;background-color: ${sel_bg}\n    ;border-radius: 4px"
tool_button_css="\n    ;color: ${fg}\n    ;background: ${bg}\n    ;border: 0\n    ;border-radius: 4px"
tool_button_selected_css="\n    ;background: ${sel_bg - #222}\n    ;color: ${sel_fg}\n    ;border: 1px solid ${find_bg}"
