# Per-model sampling defaults for llama-serve.service (router presets: --models-preset).
# Section names are the router's model ids (see `curl 127.0.0.1:9931/models`).
# Precedence: command-line flags > the model's section > [*]. A request that names its own
# temperature/top_p/... (some harnesses do) still wins over everything here.
# Anything not set falls back to llama.cpp's defaults: top-k 40, top-p 0.95, min-p 0.05.
# Edit a value, then: systemctl --user restart llama-serve   (the loaded model reloads)

[*]
repeat-penalty = 1.0
# --fit shrinks a model's context to fit VRAM but never below this; a section can raise it for one model
# (the unit must NOT also pass --fit-ctx, since flags beat presets). Higher values push more of a MoE's
# experts onto the CPU, so they cost speed.
fit-ctx = 32768

# Qwen3 14B -- thinking-mode settings from the model card. The card also suggests
# presence-penalty 1.5 for quantized builds; left off because it hurts repetitive tool/code output.
[Qwen/Qwen3-14B-GGUF:Q4_K_M]
temp = 0.6
top-k = 20
top-p = 0.95
min-p = 0.0

# Qwen3.5 9B (Defiant) -- the card's "thinking mode for precise coding tasks".
[DavidAU/Qwen3.5-9B-The-Defiant-Fable-Uncensored-Heretic-NEO-IMATRIX-MAX-MTP-GGUF:Q4_K_M]
temp = 0.6
top-k = 20
top-p = 0.95
min-p = 0.0

# Gemma 4 -- Google's values (also embedded in both GGUFs).
[google/gemma-4-12B-it-qat-q4_0-gguf:Q4_0]
temp = 1.0
top-k = 64
top-p = 0.95
min-p = 0.0

[lmstudio-community/gemma-4-26B-A4B-it-QAT-GGUF:Q4_0]
temp = 1.0
top-k = 64
top-p = 0.95
min-p = 0.0
# MoE; 128k context costs ~10% decode speed (80 -> 72 tok/s at 16k prompt), measured 2026-11-04.
fit-ctx = 131072

# Nemotron 3.5 Lightning -- NVIDIA embeds temp and top-p only; top-k/min-p stay at the llama.cpp defaults.
[ggml-org/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-GGUF:Q4_0]
temp = 1.0
top-p = 0.95
# 128k context measured at ~no decode cost (86 -> 86-88 tok/s at 16k prompt).
fit-ctx = 131072

# HauhauCS Gemma4 26B-A4B (uncensored finetune) -- the GGUF embeds nothing; these are the
# repo card's "Recommended sampling" (note repeat-penalty 1.1, unlike the other models).
[HauhauCS/Gemma4-26B-A4B-QAT-Uncensored-HauhauCS-Balanced-MTP:Q4_K_M]
temp = 0.6
top-k = 64
top-p = 0.9
min-p = 0.05
repeat-penalty = 1.1
# 64k costs ~10% speed vs the 32k floor (67 -> 61 tok/s); more experts spill to CPU above that.
fit-ctx = 65536

# Qwen3-Coder: 128k was measured at 22-40 tok/s (56 at 64k) with prompts at 135-690 tok/s, so 64k is the ceiling.
# Qwen3-Coder 30B-A3B -- the card's suggestion (repetition_penalty 1.05). llama-vscode's FIM requests
# set their own top-k/top-p and skip temperature, so this only shapes chat and agent use.
[unsloth/Qwen3-Coder-30B-A3B-Instruct-GGUF:Q4_K_M]
temp = 0.7
top-k = 20
top-p = 0.8
repeat-penalty = 1.05
fit-ctx = 65536

# Qwen2.5-Coder 14B -- the model's generation_config.json. Fits entirely in VRAM, which is what makes
# FIM (/infill) fast enough for live completion.
[Qwen/Qwen2.5-Coder-14B-Instruct-GGUF:Q4_K_M]
temp = 0.7
top-k = 20
top-p = 0.8
repeat-penalty = 1.05

# Qwen3-Omni Captioner (audio in, text out), imatrix IQ3_XXS: the largest quant that sits fully in the 4080's VRAM
# beside its mmproj. The mmproj lives in the non-imatrix repo, hence explicit paths. Small context: clips are ~1k tokens.
[local/Qwen3-Omni-Captioner-i1-IQ3_XXS]
model = /home/blaise/.cache/huggingface/hub/models--mradermacher--Qwen3-Omni-30B-A3B-Captioner-i1-GGUF/snapshots/2790c8340d9eded2c41e4f084bc22136044a5f0d/Qwen3-Omni-30B-A3B-Captioner.i1-IQ3_XXS.gguf
mmproj = /home/blaise/.cache/huggingface/hub/models--mradermacher--Qwen3-Omni-30B-A3B-Captioner-GGUF/snapshots/9ab12501803d5527997f7da84583c5658f28a922/Qwen3-Omni-30B-A3B-Captioner.mmproj-Q8_0.gguf
fit-ctx = 8192
temp = 0.7
top-k = 20
top-p = 0.8
min-p = 0.0
