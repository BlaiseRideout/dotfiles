# The stats in the bar (bar.toml places them): small gauges with an icon and
# no numbers, which are in the tooltips. The media widget (the built-in one always shows album art) are plugins in
# ~/.local/share/noctalia/plugins, linked from the dotfiles.

[plugins]
enabled = [ "blaise/bar-button", "blaise/media" ]

# Keep all meters at widget scale 1.0 (effective 1.25 with the bar scale).
[widget.sysmon_2]
scale = 1.0
type = "sysmon"
stat = "gpu_temp"
glyph = "temperature"
visualization = "gauge"
show_value = false

[widget.sysmon_gpu]
scale = 1.0
type = "sysmon"
stat = "gpu_usage"
glyph = "gpu-usage"
visualization = "gauge"
show_value = false

[widget.sysmon_cpu_temp]
scale = 1.0
type = "sysmon"
stat = "cpu_temp"
glyph = "temperature"
visualization = "gauge"
show_value = false

[widget.sysmon_cpu]
scale = 1.0
type = "sysmon"
stat = "cpu_usage"
glyph = "cpu"
visualization = "gauge"
show_value = false

[widget.sysmon_3]
scale = 1.0
type = "sysmon"
stat = "ram_used"
glyph = "database"
visualization = "gauge"
show_value = false

[widget.media_player]
type = "blaise/media:player"
