# The stats in the bar (bar.toml places them): small gauges with an icon and
# no numbers, which are in the tooltips. The llama.cpp and ZMK battery meters
# and the media widget (the built-in one always shows album art) are plugins in
# ~/.local/share/noctalia/plugins, linked from the dotfiles.

[plugins]
enabled = [ "blaise/bar-button", "blaise/llama-meter", "blaise/media", "blaise/zmk-battery" ]

# Widget scale multiplies bar scale: 0.8 * 1.25 = 1.0.
# This gives every gauge a 4x12 track beside a 16px glyph, with a
# whole-pixel 2px centering offset instead of rounding 2.5px.
[widget.sysmon_2]
scale = 0.8
type = "sysmon"
stat = "gpu_temp"
glyph = "temperature"
visualization = "gauge"
show_value = false

[widget.sysmon_gpu]
scale = 0.8
type = "sysmon"
stat = "gpu_usage"
glyph = "gpu-usage"
visualization = "gauge"
show_value = false

[widget.sysmon_cpu_temp]
scale = 0.8
type = "sysmon"
stat = "cpu_temp"
glyph = "temperature"
visualization = "gauge"
show_value = false

[widget.sysmon_cpu]
scale = 0.8
type = "sysmon"
stat = "cpu_usage"
glyph = "cpu"
visualization = "gauge"
show_value = false

[widget.sysmon_3]
scale = 0.8
type = "sysmon"
stat = "ram_used"
glyph = "database"
visualization = "gauge"
show_value = false

[widget.llama]
scale = 0.8
type = "blaise/llama-meter:meter"

[widget.zmk]
scale = 0.8
type = "blaise/zmk-battery:meter"

[widget.media_player]
type = "blaise/media:player"
