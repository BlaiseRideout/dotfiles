# The bar, styled like Waybar
# The stats widgets are defined in meters.toml.

[bar.default]
background_opacity = 0.6
thickness = 35
scale = 1.25
font_scale = 1
font_weight = 600
padding = 15
widget_spacing = 15
radius = 12
shadow = false
border_width = 0
capsule = false
# Every widget's colour, unless it sets its own
color = "#ffffff"
icon_color = "#ffffff"
# Every monitor but the primary gets a plain bar, like Waybar's: workspaces,
# the window title, the scratchpad buttons, tray and clock
start = [ "workspaces" ]
end = [ "fsearch", "t3code", "spotify", "tray", "clock" ]

# The primary monitor gets every widget: CachyOS's, without the spacers or the
# stats capsule. Its `match` (the output's connector) comes from the generated
# primary.toml (see dotfiles.toml), so it follows the primary at runtime.
[bar.default.monitor.primary]
start = [ "launcher", "workspaces", "sysmon_2", "sysmon_gpu", "sysmon_cpu_temp", "sysmon_cpu", "sysmon_3", "media", "llama", "zmk" ]
end = [ "fsearch", "t3code", "spotify", "tray", "volume", "network", "caffeine", "notifications", "clock", "session" ]

[widget.launcher]
custom_image = "/usr/share/pixmaps/archlinux-logo.svg"
custom_image_colorize = true
color = "#ffffff"

[widget.workspaces]
font_scale = 1.1
pill_scale = 0.9
capsule = false
capsule_radius = 12
style = "focus_hint"
show_labels = true
show_icons = false
label_source = "name"
max_label_chars = 2
focused_color = "#ffffff"
occupied_color = "#ffffff"
empty_color = "#ffffff"
urgent_color = "#ffffff"

[widget.active_window]
display = "text_only"
max_length = 520

[widget.tray]
capsule = false
# Noctalia 5.4 has no icon override map. noctalia-flat-tray.service publishes
# the same items with Waybar's white SVGs and forwards clicks and menus.
# Dropbox's ID reduces to "dropbox", which also matches the proxy's original
# title. Match its stock icon names instead so the proxy keeps verbatim hover text.
hidden = [ "discord_status_icon", "dropboxstatus-idle", "dropboxstatus-busy", "dropboxstatus-busy2", "dropboxstatus-x", "dropboxstatus-logo", "dropboxstatus-blank" ]

# CachyOS gives the widgets below their own colour (secondary, or error for
# session), so the bar's white is repeated on each

[widget.clock]
color = "#ffffff"
format = "{:%a, %b %d %R}"

[widget.network]
color = "#ffffff"
show_label = false

[widget.notifications]
color = "#ffffff"

[widget.volume]
color = "#ffffff"
show_label = false

[widget.session]
color = "#ffffff"

# The Waybar scratchpad buttons: show/hide the existing app window.
[widget.fsearch]
type = "custom_button"
glyph = "search"
tooltip = "Search files"
color = "#ffffff"
capsule = false

[widget.fsearch.actions]
left = "exec $HOME/.config/sway/scratchpad-app.sh fsearch toggle"

[widget.t3code]
type = "custom_button"
glyph = ""
label = "T3"
font_weight = 700
tooltip = "T3 Code"
color = "#ffffff"
capsule = false

[widget.t3code.actions]
left = "exec $HOME/.config/sway/scratchpad-app.sh t3code toggle"
middle = "exec $HOME/.config/sway/scratchpad-app.sh t3code toggle"
right = "exec $HOME/.config/sway/scratchpad-app.sh t3code toggle"

# Play/pause while a player is open, otherwise launch Spotify (as Waybar did).
[widget.spotify]
type = "custom_button"
glyph = "brand-spotify-filled"
tooltip = "Spotify"
color = "#ffffff"
capsule = false

[widget.spotify.actions]
left = "exec sh -c 'case $(playerctl status 2>/dev/null) in Playing|Paused) playerctl play-pause;; *) setsid -f spotify-launcher >/dev/null 2>&1;; esac'"

# Keep the media widget on the bar when nothing is playing
[widget.media]
hide_when_no_media = false
