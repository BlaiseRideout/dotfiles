# fuzzel: Hyprland's launcher ($mod+d apps, $mod+r commands, $mod+minus
# windows, $mod+v clipboard; see hyprland.lua and the scripts in .config/hypr).
# Window colours from sway/config's client.* lines, like hyprland.lua's borders
# and hypr/hyprtoolkit.conf: pink border, deep pink selection, cream text on
# dark grey. Check with `fuzzel --check-config`.

[main]
font=Ubuntu:size=11
prompt="   "
placeholder=Search
icon-theme=Mint-Y-Orange
terminal=kitty -e
width=44
lines=12
horizontal-pad=20
vertical-pad=16
inner-pad=12
line-height=26
image-size-ratio=0.6
match-counter=yes

[colors]
background=222222ff
text=f7f6ecff
message=888888ff
prompt=d18ea6ff
placeholder=888888ff
input=f7f6ecff
match=d18ea6ff
selection=4e262fff
selection-text=ffffffff
selection-match=d18ea6ff
counter=888888ff
border=d18ea6ff

[border]
# The windows' 5px border (hyprland.lua), rounder like the other popups
width=5
radius=12
selection-radius=6

[key-bindings]
# Shift+Delete deletes a clipboard entry in clipboard.sh (custom-1 exits with
# code 10); the launcher's "forget this app" moves to Control+Shift+Delete
custom-1=Shift+Delete
expunge=Control+Shift+Delete
